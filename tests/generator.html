<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тесты инвариантов</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #29405c; }
  h1 { font-size: 26px; }
  h2 { font-size: 18px; margin: 22px 0 6px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 4px 0; }
  .ok::before { content: '✅ '; }
  .fail::before { content: '❌ '; }
  .fail { color: #a21c1c; font-weight: 700; }
  .msg { display: block; font-weight: 400; font-size: 14px; margin-left: 26px; }
  #summary { font-size: 20px; font-weight: 800; padding: 12px 16px; border-radius: 12px; background: #eaf0fa; }
  #summary.pass { background: #dff5dc; }
  #summary.fail-all { background: #fde0e0; color: #a21c1c; }
</style>
</head>
<body>
<h1>Тесты инвариантов генераторов</h1>
<p id="summary" role="status" aria-live="polite">Запуск…</p>
<div id="report"></div>
<script type="module">
import { loadJSON } from '../shared/js/content/loader.js';
import { runSuite } from './suite.js';

const summary = document.getElementById('summary');
const report = document.getElementById('report');

function el(tag, text, className) {
  const node = document.createElement(tag);
  node.textContent = text;
  if (className) node.className = className;
  return node;
}

try {
  const [rounds, memory] = await Promise.all([
    loadJSON('../shared/content/rounds-tretiy.json'),
    loadJSON('../shared/content/levels-memory.json')
  ]);
  let cleanForTTS = null;
  try {
    ({ cleanForTTS } = await import('../shared/js/core/voice.js'));
  } catch (e) {
    console.warn('voice.js не загружен', e);
  }
  const results = runSuite({ rounds, memory, cleanForTTS });
  const groups = new Map();
  results.forEach((r) => {
    if (!groups.has(r.group)) groups.set(r.group, []);
    groups.get(r.group).push(r);
  });
  groups.forEach((items, group) => {
    report.append(el('h2', group));
    const list = document.createElement('ul');
    items.forEach((r) => {
      const li = el('li', r.name, r.ok ? 'ok' : 'fail');
      if (!r.ok) li.append(el('span', r.message, 'msg'));
      list.append(li);
    });
    report.append(list);
  });
  const failed = results.filter((r) => !r.ok).length;
  summary.textContent = failed === 0
    ? `Все проверки пройдены: ${results.length} из ${results.length}`
    : `Провалено проверок: ${failed} из ${results.length}`;
  summary.className = failed === 0 ? 'pass' : 'fail-all';
  document.title = (failed === 0 ? 'PASS' : 'FAIL') + ' — тесты инвариантов';
} catch (err) {
  summary.textContent = 'Ошибка запуска тестов: ' + err.message + '. Откройте страницу через HTTP-сервер, не через file://.';
  summary.className = 'fail-all';
}
</script>
</body>
</html>
