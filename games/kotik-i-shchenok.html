<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff6df">
<title>Котик и щенок</title>
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../shared/img/icon-192.png">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/cards.css">
</head>
<body>
<main class="game">
  <nav class="nav">
    <a class="button secondary" href="../index.html">← Все игры</a>
    <div class="toggles" id="toggles"></div>
  </nav>
  <h1>Котик и щенок</h1>
  <p class="subtitle">Собери три картинки в ряд!</p>
  <div class="mode" role="group" aria-label="Режим игры">
    <button class="button secondary" type="button" id="together" aria-pressed="true">Играем вдвоём</button>
    <button class="button secondary" type="button" id="computer" aria-pressed="false">С компьютером</button>
  </div>
  <section class="player-choice-panel" id="playerChoice" aria-labelledby="playerChoiceTitle" hidden>
    <span class="player-choice-title" id="playerChoiceTitle">За кого играешь?</span>
    <div class="mode player-choice" role="group" aria-label="Выбор персонажа">
      <button class="button secondary" type="button" id="playCat" aria-pressed="true">
        <img src="../shared/img/ttt-cat.webp" alt="" aria-hidden="true"> За котика
      </button>
      <button class="button secondary" type="button" id="playPuppy" aria-pressed="false">
        <img src="../shared/img/ttt-puppy.webp" alt="" aria-hidden="true"> За щенка
      </button>
    </div>
  </section>
  <div class="level" id="level" role="group" aria-label="Сложность" hidden></div>
  <p class="level-hint" id="levelHint"></p>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div role="group" class="board ttt" id="board" aria-label="Игровое поле 3 на 3"></div>
  <button type="button" class="button orange restart" id="restart">🔄 Играть снова</button>
  <p class="hint" id="hint"></p>
  <div id="suggest"></div>
</main>
<script type="module">
import { loadJSON } from '../shared/js/content/loader.js';
import { createEl, qs } from '../shared/js/core/dom.js';
import { sndDraw, sndMove, sndWinGood, sndWinSoft } from '../shared/js/core/sound.js';
import { speak } from '../shared/js/core/voice.js';
import { chooseComputerMove, result } from '../shared/js/logic/tictactoe.js';
import { LEVEL_LABELS, mountLevelSwitch } from '../shared/js/ui/level-switch.js';
import { bootGame } from '../shared/js/ui/boot.js';
import { createGameProgress } from '../shared/js/ui/progress-ui.js';

const CHARACTERS = {
  cat: { src: '../shared/img/ttt-cat.webp', alt: 'Котик', name: 'котик', object: 'котика' },
  puppy: { src: '../shared/img/ttt-puppy.webp', alt: 'Щенок', name: 'щенок', object: 'щенка' }
};
const [boardEl, statusEl, hintEl, levelHintEl, levelGroup, togetherBtn, computerBtn,
  playerChoice, playCatBtn, playPuppyBtn] =
  ['#board', '#status', '#hint', '#levelHint', '#level', '#together', '#computer',
    '#playerChoice', '#playCat', '#playPuppy'].map((id) => qs(id));
const progress = createGameProgress({ gameId: 'kotik-i-shchenok', title: 'Котик и щенок', host: qs('#suggest') });

let cfgAll = null;
let levelSwitch = null;
let board = [];
let turn = 'X';
let finished = false;
let vsComputer = false;
let playerCharacter = 'cat';
let winningLine = null;
let timer = null;
let cells = [];

const levelCfg = () => cfgAll[levelSwitch.get()];
function characterFor(side) {
  if (!vsComputer) return side === 'X' ? CHARACTERS.cat : CHARACTERS.puppy;
  const human = CHARACTERS[playerCharacter];
  const computer = playerCharacter === 'cat' ? CHARACTERS.puppy : CHARACTERS.cat;
  return side === 'X' ? human : computer;
}

function winMessages(winner) {
  const humanWon = winner === 'X';
  const winnerName = characterFor(winner).name;
  const text = vsComputer
    ? (humanWon ? 'Победа! Молодец!' : `${winnerName[0].toUpperCase()}${winnerName.slice(1)} победил. Попробуй ещё раз`)
    : `Победил ${winnerName}! Молодец!`;
  return { status: text, voice: text, good: humanWon || !vsComputer };
}

function render() {
  cells.forEach((cell, i) => {
    const symbol = board[i] ? characterFor(board[i]) : null;
    if (symbol) {
      cell.replaceChildren(createEl('img', {
        attrs: {
          src: symbol.src, alt: symbol.alt, draggable: 'false',
          style: 'display:block;width:82%;height:82%;object-fit:contain;pointer-events:none;user-select:none'
        }
      }));
    } else cell.replaceChildren();
    cell.disabled = Boolean(board[i]) || finished || (vsComputer && turn === 'O');
    cell.classList.toggle('win', Boolean(winningLine) && winningLine.includes(i));
    const who = { X: 'котик', O: 'щенок' }[board[i]] || 'пусто';
    cell.setAttribute('aria-label', `Ряд ${Math.floor(i / 3) + 1}, столбец ${(i % 3) + 1}: ${who}`);
  });
  const end = result(board);
  statusEl.textContent = end?.winner ? winMessages(end.winner).status
    : end ? 'Ничья! Сыграем ещё?'
      : vsComputer && turn === 'O' ? `${characterFor('O').name[0].toUpperCase()}${characterFor('O').name.slice(1)} думает...`
        : `Ходит ${characterFor(turn).name}`;
}

function reset() {
  clearTimeout(timer);
  board = Array(9).fill('');
  finished = false;
  winningLine = null;
  turn = vsComputer && levelCfg().computerFirst ? 'O' : 'X';
  render();
  speak(turn === 'O' ? `${characterFor('O').name[0].toUpperCase()}${characterFor('O').name.slice(1)} ходит первым` : `Ходит ${characterFor('X').name}`);
  if (vsComputer && turn === 'O') timer = setTimeout(computerMove, 500);
}

function place(i) {
  board[i] = turn;
  const end = result(board);
  if (end) {
    finished = true;
    winningLine = end.line || null;
    const lost = vsComputer && end.winner === 'O';
    if (vsComputer) progress.answer(!lost, lost ? 'проигрыш щенку' : null);
    if (!lost) progress.roundWon();
    const msg = end.winner ? winMessages(end.winner) : { voice: 'Ничья! Сыграем ещё?' };
    (end.winner ? (msg.good ? sndWinGood : sndWinSoft) : sndDraw)();
    speak(msg.voice);
  } else {
    turn = turn === 'X' ? 'O' : 'X';
    sndMove();
  }
  render();
}

function move(i) {
  if (finished || board[i] || (vsComputer && turn === 'O')) return;
  place(i);
  if (!finished && vsComputer && turn === 'O') timer = setTimeout(computerMove, 550);
}

function computerMove() {
  if (finished || !vsComputer || turn !== 'O') return;
  const moveIndex = chooseComputerMove(board, levelCfg());
  if (moveIndex !== null) place(moveIndex);
}

function updateUI() {
  togetherBtn.setAttribute('aria-pressed', String(!vsComputer));
  computerBtn.setAttribute('aria-pressed', String(vsComputer));
  levelGroup.hidden = !vsComputer;
  playerChoice.hidden = !vsComputer;
  playCatBtn.setAttribute('aria-pressed', String(playerCharacter === 'cat'));
  playPuppyBtn.setAttribute('aria-pressed', String(playerCharacter === 'puppy'));
  const texts = vsComputer ? levelCfg() : cfgAll.together;
  const opponent = characterFor('O').name;
  const opponentTitle = `${opponent[0].toUpperCase()}${opponent.slice(1)}`;
  levelHintEl.textContent = vsComputer
    ? texts.levelHint.replaceAll('Щенок', opponentTitle).replaceAll('щенка', opponent)
    : texts.levelHint;
  if (!vsComputer) {
    hintEl.textContent = texts.hint;
    return;
  }
  const human = characterFor('X');
  hintEl.textContent = texts.hint.replace(
    /Ты играешь котиком\.?/,
    `Ты играешь за ${human.object}.`
  );
}

async function init() {
  bootGame();
  try {
    cfgAll = (await loadJSON('../shared/content/levels-memory.json'))['tic-tac-toe'];
    if (!cfgAll?.easy || !cfgAll.together) throw new Error('Нет настроек');
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Не удалось загрузить игру. Позовите взрослого.';
    return;
  }
  cells = Array.from({ length: 9 }, (_, i) => createEl('button', {
    className: 'cell',
    attrs: { type: 'button' },
    on: { click: () => move(i) }
  }));
  boardEl.replaceChildren(...cells);

  levelSwitch = mountLevelSwitch({
    container: levelGroup,
    hints: { easy: '', hard: '', veryHard: '' },
    storageKey: 'ks-level',
    onChange: (level) => { progress.levelChanged(); updateUI(); reset(); speak(LEVEL_LABELS[level]); }
  });
  progress.attach(levelSwitch);
  togetherBtn.addEventListener('click', () => { vsComputer = false; updateUI(); reset(); });
  computerBtn.addEventListener('click', () => { vsComputer = true; updateUI(); reset(); });
  playCatBtn.addEventListener('click', () => {
    if (playerCharacter === 'cat') return;
    playerCharacter = 'cat'; updateUI(); reset();
  });
  playPuppyBtn.addEventListener('click', () => {
    if (playerCharacter === 'puppy') return;
    playerCharacter = 'puppy'; updateUI(); reset();
  });
  qs('#restart').addEventListener('click', reset);
  updateUI();
  reset();
}

init();
</script>
</body>
</html>
