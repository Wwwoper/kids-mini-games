<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff6df">
<title>Сколько?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E%F0%9F%94%A2%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../shared/img/icon-192.png">
<link rel="stylesheet" href="../shared/css/base.css">
<link rel="stylesheet" href="../shared/css/layout.css">
<link rel="stylesheet" href="../shared/css/cards.css">
</head>
<body>
<main class="game">
  <nav class="nav">
    <a class="button secondary" href="../index.html">← Все игры</a>
    <div class="toggles" id="toggles"></div>
  </nav>
  <h1>🔢 Сколько?</h1>
  <p class="subtitle">Посчитай и найди нужную цифру</p>
  <div class="level" id="level" role="group" aria-label="Сложность"></div>
  <p class="level-hint" id="levelHint"></p>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="objects" id="prompt" aria-label="Задание"></div>
  <div class="options count-options" id="options" aria-label="Варианты ответа"></div>
  <button type="button" class="button orange next" id="next" hidden>🔄 Ещё</button>
  <div id="suggest"></div>
</main>
<script type="module">
import { getCard } from '../shared/js/content/cards.js';
import { loadJSON } from '../shared/js/content/loader.js';
import { qs } from '../shared/js/core/dom.js';
import { sndError, sndSuccess } from '../shared/js/core/sound.js';
import { speak } from '../shared/js/core/voice.js';
import { NUMBER_WORDS, makeRound } from '../shared/js/logic/count.js';
import { createCard } from '../shared/js/ui/card.js';
import { mountLevelSwitch } from '../shared/js/ui/level-switch.js';
import { bootGame } from '../shared/js/ui/boot.js';
import { createGameProgress } from '../shared/js/ui/progress-ui.js';

const statusEl = qs('#status');
const promptEl = qs('#prompt');
const optionsEl = qs('#options');
const nextBtn = qs('#next');
const progress = createGameProgress({ gameId: 'skolko', title: 'Сколько?', host: qs('#suggest') });

let levels = null;
let items = [];
let levelSwitch = null;
let state = null;
let locked = false;
let firstRound = true;

const cfg = () => levels[levelSwitch.get()];

function newRound() {
  locked = false;
  nextBtn.hidden = true;
  const round = makeRound(items, cfg());
  if (!round) {
    statusEl.textContent = 'Не получилось создать задание. Позовите взрослого.';
    return;
  }
  state = round;
  optionsEl.dataset.count = String(round.options.length);
  const toDigit = round.mode === 'count-to-digit';

  if (toDigit) {
    promptEl.replaceChildren(...Array.from({ length: round.count }, () => createCard(round.item)));
  } else {
    const digit = createCard({ emoji: String(round.count), label: 'цифра ' + NUMBER_WORDS[round.count] });
    digit.classList.add('digit');
    promptEl.replaceChildren(digit);
  }

  optionsEl.replaceChildren(...round.options.map((n) => {
    const emoji = toDigit ? String(n) : round.item.emoji.repeat(n);
    const btn = createCard({ id: n, emoji, label: NUMBER_WORDS[n] }, { tag: 'button', base: 'opt', onClick: choose });
    if (!toDigit) btn.classList.add('group');
    return btn;
  }));

  statusEl.textContent = toDigit ? 'Сколько здесь? Найди цифру' : 'Найди столько же картинок';
  speak(toDigit
    ? (firstRound ? 'Посчитай картинки и найди нужную цифру' : 'Сколько здесь?')
    : (firstRound ? 'Найди столько же картинок, сколько показывает цифра' : 'Найди столько же картинок'));
  firstRound = false;
}

function choose(opt, btn) {
  if (locked) return;
  if (opt.id === state.count) {
    locked = true;
    optionsEl.querySelectorAll('button').forEach((b) => { b.disabled = true; });
    btn.classList.add('win');
    const word = NUMBER_WORDS[state.count];
    statusEl.textContent = `✅ Верно! Это ${state.count}`;
    sndSuccess();
    speak('Верно! Это ' + word);
    progress.right();
    nextBtn.hidden = false;
    nextBtn.focus();
  } else {
    sndError();
    btn.classList.add('wrong');
    statusEl.textContent = '🤔 Посчитай ещё раз';
    speak(NUMBER_WORDS[opt.id] + '. Посчитай ещё раз');
    progress.wrong(`выбрано ${opt.id} вместо ${state.count}`);
    setTimeout(() => btn.classList.remove('wrong'), 400);
  }
}

async function init() {
  bootGame();
  try {
    const data = await loadJSON('../shared/content/skolko.json');
    levels = data.levels;
    items = (data.items || []).map(getCard).filter(Boolean);
    if (!levels || !levels.easy || !items.length) throw new Error('Некорректный skolko.json');
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Не удалось загрузить задания. Позовите взрослого.';
    return;
  }
  levelSwitch = mountLevelSwitch({
    container: qs('#level'),
    hintEl: qs('#levelHint'),
    hints: Object.fromEntries(Object.entries(levels).map(([id, c]) => [id, c.hint])),
    storageKey: 'sk-level',
    onChange: () => { firstRound = true; progress.levelChanged(); newRound(); }
  });
  progress.attach(levelSwitch);
  nextBtn.addEventListener('click', newRound);
  newRound();
}

init();
</script>
</body>
</html>
